<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Material Management ERP</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== TOP HEADER ===================== -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="app-logo">&#9632;</span>
      <span class="app-name">Site<span class="accent">ERP</span></span>
    </div>
    <div class="topbar-right">
      <span class="company-name" id="companyName">Your Company Pvt. Ltd.</span>
      <div class="user-chip" id="userChip">A</div>
    </div>
  </header>

  <div class="app-body">

    <!-- ===================== LEFT SIDEBAR ===================== -->
    <nav class="sidebar" id="sidebar">
      <!-- populated by app.js -->
    </nav>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="main" id="mainContent">
      <!-- populated by app.js -->
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
